[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trailnutri"
version = "0.1.0"
description = "Planificateur de nutrition pour trail / course à pied (moteur déterministe)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/W : style PEP 8, F : erreurs (imports inutilisés...), I : ordre des imports,
# B : pièges courants, UP : syntaxe moderne
select = ["E", "W", "F", "I", "B", "UP"]
